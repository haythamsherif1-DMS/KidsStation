<!DOCTYPE html>
<html dir="rtl" lang="ar" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HR Professional Portal</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root {
            --HR-blue: #1A3668;
            --HR-blue-contrast: #1A3668;
            --HR-red: #E31D2B;
            --HR-orange: #F37021;
            --soft-bg: #F8FAFC;
            --text-dark: #1E293B;
            --sidebar-bg: #F1F5F9;
            --card-bg: #FFFFFF;
            --border-color: rgba(0,0,0,0.06);
            --shadow-color: rgba(0,0,0,0.08);
            --muted-text: #64748B;
            --icon-bg: rgba(26,54,104,0.06);
        }
        html[data-theme="dark"] {
            --soft-bg: #0B1220;
            --text-dark: #E7ECF3;
            --sidebar-bg: #111C2E;
            --card-bg: #16213A;
            --border-color: rgba(255,255,255,0.08);
            --shadow-color: rgba(0,0,0,0.55);
            --muted-text: #94A3B8;
            --HR-blue-contrast: #6C93D6;
            --icon-bg: rgba(108,147,214,0.16);
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--soft-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; overflow-x: hidden;
            min-height: 100vh;
            color: var(--text-dark);
            transition: background-color .35s ease, color .35s ease;
        }
        .navbar {
            background: var(--card-bg);
            box-shadow: 0 4px 20px var(--shadow-color);
            padding: 12px 5%;
            position: sticky; top: 0; z-index: 1000;
            transition: background-color .35s ease;
        }
        .navbar-brand-text { font-weight: 700; color: var(--text-dark); font-size: 1.05rem; }
        .icon-btn-nav {
            cursor: pointer;
            width: 40px; height: 40px;
            border: none; background: transparent;
            display: flex; align-items: center; justify-content: center;
        }
        .theme-toggle, .lang-toggle {
            cursor: pointer;
            padding: 8px 16px;
            border: 2px solid var(--HR-blue-contrast);
            border-radius: 25px;
            color: var(--HR-blue-contrast);
            font-weight: bold;
            transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .theme-toggle { width: 42px; height: 42px; padding: 0; }
        .theme-toggle:hover, .lang-toggle:hover { background: var(--HR-blue-contrast); color: white; }

        /* ===== Selection Screen ===== */
        .selection-screen {
            min-height: calc(100vh - 80px);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 50px 20px; gap: 44px;
        }
        .selection-eyebrow {
            display: inline-block; padding: 6px 18px; border-radius: 20px;
            background: var(--icon-bg); color: var(--HR-blue-contrast);
            font-weight: 700; font-size: 0.78rem; letter-spacing: .5px; margin-bottom: 16px;
        }
        .selection-hero { text-align: center; max-width: 620px; }
        .selection-hero img { height: 56px; margin-bottom: 18px; border-radius: 12px; }
        .selection-hero h1 { font-size: 2.15rem; font-weight: 800; color: var(--text-dark); margin-bottom: 10px; }
        .selection-hero p { color: var(--muted-text); font-size: 1.02rem; margin: 0; }
        .portal-cards { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
        .portal-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 30px 32px;
            width: 300px;
            text-align: center;
            cursor: pointer;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px var(--shadow-color);
            transition: all .35s cubic-bezier(.4,0,.2,1);
            position: relative;
            overflow: hidden;
        }
        .portal-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, var(--HR-blue-contrast), var(--HR-orange));
            transform: scaleX(0); transition: transform .35s ease;
        }
        .portal-card.admin-card::before { background: linear-gradient(90deg, var(--HR-orange), var(--HR-red)); }
        .portal-card:hover::before { transform: scaleX(1); }
        .portal-card:hover { transform: translateY(-8px); box-shadow: 0 20px 45px var(--shadow-color); }
        .portal-icon-wrap {
            width: 84px; height: 84px; border-radius: 50%;
            background: var(--icon-bg); color: var(--HR-blue-contrast);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.1rem; margin: 0 auto 20px; transition: .35s;
        }
        .portal-card.admin-card .portal-icon-wrap { background: rgba(243,112,33,0.14); color: var(--HR-orange); }
        .portal-card:hover .portal-icon-wrap { transform: scale(1.08) rotate(-4deg); }
        .portal-card-title { font-size: 1.32rem; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; }
        .portal-card-desc { color: var(--muted-text); font-size: 0.9rem; margin-bottom: 18px; min-height: 42px; line-height: 1.5; }
        .portal-chip-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
        .portal-chip {
            width: 34px; height: 34px; border-radius: 10px;
            background: var(--soft-bg); display: flex; align-items: center; justify-content: center;
            color: var(--muted-text); font-size: 0.82rem; border: 1px solid var(--border-color);
        }
        .portal-card-cta { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--HR-blue-contrast); }
        .portal-card.admin-card .portal-card-cta { color: var(--HR-orange); }
        .portal-card-cta i { transition: transform .3s ease; }
        html[dir="rtl"] .portal-card:hover .portal-card-cta i { transform: translateX(-4px); }
        html[dir="ltr"] .portal-card:hover .portal-card-cta i { transform: translateX(4px); }

        /* ===== Dashboard ===== */
        .dashboard-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 5%; flex-wrap: wrap; gap: 12px;
        }
        .dashboard-welcome { font-weight: 700; color: var(--text-dark); font-size: 1.05rem; }
        .dashboard-welcome span { color: var(--HR-blue-contrast); }
        .switch-portal-btn {
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 20px; border-radius: 25px; font-weight: 700; font-size: 0.85rem;
            background: var(--icon-bg); color: var(--HR-blue-contrast); border: none; transition: .3s;
        }
        .switch-portal-btn:hover { background: var(--HR-blue-contrast); color: white; }

        .offcanvas {
            width: 320px !important;
            border: none;
            box-shadow: 10px 0 30px var(--shadow-color);
            background-color: var(--sidebar-bg) !important;
            color: var(--text-dark);
        }
        .sidebar-header {
            background: linear-gradient(135deg, var(--HR-blue) 0%, #102244 100%);
            color: white;
            padding: 30px 24px;
            position: relative;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(26, 54, 104, 0.2);
        }
        .sidebar-header .btn-close-white {
            position: absolute; top: 25px; left: 20px; opacity: 0.8; transition: 0.3s;
        }
        html[dir="ltr"] .sidebar-header .btn-close-white { left: auto; right: 20px; }
        .sidebar-header .btn-close-white:hover { opacity: 1; transform: rotate(90deg); }
        .nav-links-wrapper { padding: 20px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
        .nav-link-sidebar {
            padding: 14px 18px;
            color: var(--text-dark);
            text-decoration: none;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg);
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600; font-size: 0.95rem;
            box-shadow: 0 2px 6px var(--shadow-color);
            border: 1px solid var(--border-color);
        }
        .nav-link-sidebar i.nav-icon {
            color: var(--HR-blue-contrast);
            width: 36px; height: 36px;
            background: var(--icon-bg);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; transition: all 0.3s ease; margin-left: 10px;
        }
        html[dir="ltr"] .nav-link-sidebar i.nav-icon { margin-left: 0; margin-right: 10px; }
        .nav-link-sidebar .arrow-icon { font-size: 0.8rem; color: #94A3B8; transition: transform 0.3s ease; }
        .nav-link-sidebar:hover { color: var(--HR-orange); transform: translateY(-2px); box-shadow: 0 6px 15px var(--shadow-color); border-color: rgba(243, 112, 33, 0.3); }
        .nav-link-sidebar:hover i.nav-icon { background: rgba(243, 112, 33, 0.14); color: var(--HR-orange); transform: scale(1.05); }
        .nav-link-sidebar:hover .arrow-icon { color: var(--HR-orange); transform: translateX(-4px); }
        html[dir="ltr"] .nav-link-sidebar:hover .arrow-icon { transform: translateX(4px); }
        .sidebar-footer { padding: 6px 16px 20px; }
        .switch-portal-link {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 13px; border-radius: 12px; cursor: pointer;
            border: 2px dashed var(--border-color); color: var(--muted-text);
            font-weight: 700; font-size: 0.88rem; transition: .3s;
        }
        .switch-portal-link:hover { border-color: var(--HR-orange); color: var(--HR-orange); }
        .notification-badge {
            background-color: var(--HR-red); color: white; font-weight: bold; font-size: 12px;
            min-width: 24px; height: 24px; display: none; align-items: center; justify-content: center;
            border-radius: 50%; box-shadow: 0 2px 8px rgba(227, 29, 43, 0.4); margin-left: 10px;
        }
        html[dir="ltr"] .notification-badge { margin-left: 0; margin-right: 10px; }

        .hero-container {
            min-height: calc(100vh - 140px);
            display: flex; align-items: center; justify-content: center;
            perspective: 1000px; padding: 20px;
        }
        .scene-3d {
            width: 80%; max-width: 420px; transform-style: preserve-3d;
            transition: all 0.6s ease; transform: rotateX(5deg) rotateY(-5deg);
        }
        @media (max-width: 768px) {
            .scene-3d { width: 65%; max-width: 230px; transform: rotateX(0deg) rotateY(0deg); }
            .portal-card { width: 100%; max-width: 340px; }
        }
        .main-hero-img {
            width: 100%; height: auto; object-fit: contain; border-radius: 20px;
            box-shadow: 0 15px 35px var(--shadow-color); border: 5px solid var(--card-bg);
        }
        .modal-full { max-width: 100%; margin: 0; height: 100%; }
        .modal-content { height: 100vh; border: none; border-radius: 0; overflow: hidden; position: relative; background-color: var(--card-bg); }
        .back-nav-bar {
            background: var(--card-bg);
            padding: 12px 25px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid var(--border-color);
        }
        .modal-title-text { color: var(--HR-blue-contrast); font-weight: bold; }
        .btn-back-style {
            background: var(--HR-blue);
            color: white; border: none; padding: 8px 25px;
            border-radius: 50px; font-weight: bold;
            display: flex; align-items: center; gap: 10px;
            cursor: pointer; transition: 0.3s;
        }
        .btn-back-style:hover { background: var(--HR-red); }
        #globalLoader { position: absolute; top: 65px; left: 0; right: 0; bottom: 0; background: var(--card-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1200; }
        .loader-visual {
            width: 50px; height: 50px; border: 4px solid #f3f3f3;
            border-top: 4px solid var(--HR-orange); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loadingTxt { color: var(--HR-blue-contrast); }
        iframe { width: 100%; height: calc(100vh - 65px); border: none; display: block; visibility: hidden; }

        /* ===== Rate Us floating button ===== */
        .rate-us-fab {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            z-index: 1050;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 60px;
            padding: 16px 8px;
            background: linear-gradient(160deg, var(--HR-orange), var(--HR-red));
            color: #fff;
            border: none;
            border-radius: 16px 0 0 16px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(227,29,43,0.35);
            transition: width .3s cubic-bezier(.4,0,.2,1), padding .3s ease;
            text-align: center;
            transform-origin: center right;
            animation: rateFabRock 3.2s ease-in-out infinite, rateFabGlow 2.6s ease-in-out infinite;
        }
        html[dir="ltr"] .rate-us-fab { right: auto; left: 0; border-radius: 0 16px 16px 0; transform-origin: center left; }
        .rate-us-fab:hover { width: 76px; animation-play-state: running; }
        .rate-us-fab span { position: relative; z-index: 2; font-size: 0.72rem; font-weight: 800; line-height: 1.25; }

        .rate-us-shine {
            position: absolute; inset: 0; overflow: hidden;
            border-radius: inherit; pointer-events: none;
        }
        .rate-us-shine::after {
            content: '';
            position: absolute; top: -60%; left: -70%;
            width: 45%; height: 220%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,.65), transparent);
            transform: rotate(20deg);
            animation: rateShineSweep 3.2s ease-in-out infinite;
        }
        @keyframes rateShineSweep {
            0%, 30% { left: -70%; }
            65%, 100% { left: 140%; }
        }

        .rate-us-fab i.rate-us-icon {
            position: relative; z-index: 2;
            font-size: 1.4rem;
            animation: rateStarPop 1.4s ease-in-out infinite;
        }
        @keyframes rateStarPop {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.3) rotate(-16deg); }
            50% { transform: scale(1.05) rotate(10deg); }
            75% { transform: scale(1.3) rotate(-10deg); }
        }

        .rate-sparkle {
            position: absolute;
            font-size: 0.5rem;
            color: #fff;
            opacity: 0;
            z-index: 3;
            pointer-events: none;
            animation: rateSparkleTwinkle 2.4s ease-in-out infinite;
        }
        .rate-sparkle-1 { top: 12px; left: 8px; animation-delay: .3s; }
        .rate-sparkle-2 { bottom: 30px; left: 10px; animation-delay: 1.15s; font-size: 0.4rem; }
        html[dir="ltr"] .rate-sparkle-1 { left: auto; right: 8px; }
        html[dir="ltr"] .rate-sparkle-2 { left: auto; right: 10px; }
        @keyframes rateSparkleTwinkle {
            0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(180deg); }
        }

        @keyframes rateFabRock {
            0%, 100% { transform: translateY(-50%) rotate(0deg) scale(1); }
            8%  { transform: translateY(-50%) rotate(-8deg) scale(1.05); }
            16% { transform: translateY(-50%) rotate(7deg) scale(1.05); }
            24% { transform: translateY(-50%) rotate(-5deg) scale(1.03); }
            32% { transform: translateY(-50%) rotate(3deg) scale(1.02); }
            40%, 85% { transform: translateY(-50%) rotate(0deg) scale(1); }
        }
        @keyframes rateFabGlow {
            0%, 100% { box-shadow: 0 8px 25px rgba(227,29,43,0.35); }
            50% { box-shadow: 0 10px 42px rgba(227,29,43,0.75); }
        }

        @media (max-width: 576px) {
            .rate-us-fab { width: 48px; padding: 12px 6px; gap: 4px; }
            .rate-us-fab:hover { width: 58px; }
            .rate-us-fab i.rate-us-icon { font-size: 1.15rem; }
            .rate-us-fab span { font-size: 0.62rem; }
        }
    </style>
</head>
<body>
<nav class="navbar d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
        <button class="icon-btn-nav" id="hamburgerBtn" style="display:none;" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
            <i class="fas fa-bars fa-2x" style="color: var(--HR-blue-contrast);"></i>
        </button>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfjjAlk-kqXEaS6WivFvYQBC9A4ru90F6AgQ&s" height="38" alt="Logo" style="border-radius:8px;">
        <span class="navbar-brand-text d-none d-sm-inline">HR System</span>
    </div>
    <div class="d-flex align-items-center gap-2">
        <div class="theme-toggle" onclick="toggleTheme()" title="ليلي / نهاري">
            <i class="fas fa-moon" id="themeIcon"></i>
        </div>
        <div class="lang-toggle" onclick="toggleLanguage()" id="langBtn">EN</div>
    </div>
</nav>

<!-- ===== Rate Us Floating Button ===== -->
<button type="button" class="rate-us-fab" id="rateUsFab" onclick="openRateUs()" title="قيّم تجربتك">
    <span class="rate-us-shine"></span>
    <span class="rate-sparkle rate-sparkle-1"><i class="fas fa-star"></i></span>
    <span class="rate-sparkle rate-sparkle-2"><i class="fas fa-star"></i></span>
    <i class="fas fa-star rate-us-icon"></i>
    <span id="rateUsTxt">قيّم الابلكيشن</span>
</button>

<!-- ===== Portal Selection Screen ===== -->
<div class="selection-screen" id="selectionScreen">
    <div class="selection-hero animate__animated animate__fadeInDown">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfjjAlk-kqXEaS6WivFvYQBC9A4ru90F6AgQ&s" alt="Logo">
        <div class="selection-eyebrow" id="selEyebrow">نظام الموارد البشرية</div>
        <h1 id="selTitle">أهلاً بك</h1>
        <p id="selSubtitle">اختر البوابة المناسبة لك للمتابعة</p>
    </div>
    <div class="portal-cards">
        <div class="portal-card animate__animated animate__fadeInUp" onclick="selectPortal('employee')">
            <div class="portal-icon-wrap"><i class="fas fa-id-badge"></i></div>
            <h3 class="portal-card-title" id="empPortalTitle">بوابة الموظف</h3>
            <p class="portal-card-desc" id="empPortalDesc">البصمة، الشفتات، بياناتك ومرتبك في مكان واحد</p>
            <div class="portal-chip-row">
                <span class="portal-chip"><i class="fas fa-fingerprint"></i></span>
                <span class="portal-chip"><i class="fas fa-calendar-alt"></i></span>
                <span class="portal-chip"><i class="fas fa-file-invoice-dollar"></i></span>
                <span class="portal-chip"><i class="fas fa-bell"></i></span>
            </div>
            <span class="portal-card-cta"><span id="empEnterTxt">دخول</span> <i class="fas fa-arrow-left"></i></span>
        </div>
        <div class="portal-card admin-card animate__animated animate__fadeInUp" style="animation-delay:.1s" onclick="selectPortal('admin')">
            <div class="portal-icon-wrap"><i class="fas fa-user-tie"></i></div>
            <h3 class="portal-card-title" id="adminPortalTitle">بوابة الإدارة</h3>
            <p class="portal-card-desc" id="adminPortalDesc">إدارة شؤون الموظفين والأرشيف والتقارير</p>
            <div class="portal-chip-row">
                <span class="portal-chip"><i class="fas fa-users-cog"></i></span>
                <span class="portal-chip"><i class="fas fa-archive"></i></span>
                <span class="portal-chip"><i class="fas fa-sync-alt"></i></span>
                <span class="portal-chip"><i class="fas fa-chart-line"></i></span>
            </div>
            <span class="portal-card-cta"><span id="adminEnterTxt">دخول</span> <i class="fas fa-arrow-left"></i></span>
        </div>
    </div>
</div>

<!-- ===== Dashboard (shown after choosing a portal) ===== -->
<div id="portalDashboard" style="display:none;">
    <div class="dashboard-topbar">
        <div class="dashboard-welcome"><span id="dashPortalName">بوابة الموظف</span></div>
        <button class="switch-portal-btn" onclick="goToSelection()">
            <i class="fas fa-right-left"></i> <span id="switchPortalTxt">تبديل البوابة</span>
        </button>
    </div>
    <div class="hero-container">
        <div class="scene-3d animate__animated animate__zoomIn">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfjjAlk-kqXEaS6WivFvYQBC9A4ru90F6AgQ&s"
                class="main-hero-img"
                alt="HR Illustration">
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-start" id="sidebarMenu">
    <div class="sidebar-header">
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        <h4 id="sideTitle" class="fw-bold mb-1">HR System</h4>
        <p class="small mb-0 opacity-75" id="sideDesc">بوابة الموظف</p>
    </div>
    <div class="offcanvas-body p-0 d-flex flex-column justify-content-between">
        <div class="nav-links-wrapper" id="navLinksWrapper"></div>
        <div class="sidebar-footer">
            <div class="switch-portal-link" onclick="goToSelection()">
                <i class="fas fa-right-left"></i> <span id="switchPortalTxt2">تبديل البوابة</span>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-full">
        <div class="modal-content">
            <div class="back-nav-bar">
                <span class="modal-title-text" id="modalTitleDisplay">System</span>
                <button type="button" class="btn-back-style" data-bs-dismiss="modal">
                    <span id="backTxt">رجوع</span> <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <div class="modal-body p-0 position-relative">
                <div id="globalLoader">
                    <div class="loader-visual"></div>
                    <h5 id="loadingTxt" class="mt-3 fw-bold">جاري التحميل...</h5>
                </div>
                <iframe src="" id="appIframe" allow="geolocation"></iframe>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentLang = 'ar';
    let currentTheme = 'light';
    let currentPortal = null; // 'employee' | 'admin'
    let notifTimer = null;

    const modalEl = document.getElementById('appModal');
    const modal = new bootstrap.Modal(modalEl);
    const iframe = document.getElementById('appIframe');
    const loader = document.getElementById('globalLoader');

    // ===== Rate Us =====
    const RATE_US_URL = 'https://script.google.com/macros/s/AKfycbxx3nBNuWJ7WRV05T3YpJL5qaesZkN4G5OH8b9nm4JWqqUbb4gU91swVz7axlqUsA9m/exec';
    function openRateUs() {
        openInApp(RATE_US_URL, trans[currentLang].rateUsTitle);
    }

    // ===== Link definitions =====
    const LINKS = {
        employee: [
            { key: 'finger',  icon: 'fa-fingerprint',         geoloc: true,
              url: 'https://script.google.com/macros/s/AKfycbxeSZgc0l1yfkLl8XfpiB_HsMeqFRgjUgbjX7dVIcyx-zTCvRNY3TL6RgkagEuDhsa6/exec' },
            { key: 'shift',   icon: 'fa-business-time',
              url: 'https://script.google.com/macros/s/AKfycbwe_cUSsu29F6EjDzE1fjD5b5Zv_Rvqnav-PMTNTa3CwUzRnPoEUCVGCyvDpQSlPIbZnQ/exec' },
            { key: 'db',      icon: 'fa-users-cog',
              url: 'https://script.google.com/macros/s/AKfycbzz0oJ3_sda3gYFUP_aR5i5GnbGWLedGYcVcWBrDZKBSIHUy-PNqdtJjpngxwjEBMj0cg/exec' },
            { key: 'payroll', icon: 'fa-file-invoice-dollar',
              url: 'https://script.google.com/macros/s/AKfycbzSvQVlzQrvd0JV3VBFhB4krkZyWplNn3KHrIOfaMzLlMYgLTk5mfEVmHYG-Xg4Vi0u/exec' },
            { key: 'vacation',icon: 'fa-calendar-alt',
              url: 'https://script.google.com/macros/s/AKfycbzj8XQelDyz8t3oLdDO4n9tdw7FSF9_RT0OolPXMGX83wPnw1b6PEYxTXydMsFlxToV6w/exec' },
            { key: 'hrLetter',icon: 'fa-file-signature',
              url: 'https://script.google.com/macros/s/AKfycbyPSK6nA70ohYcrBO_MfEjKU5DI3pHGRcQaaLCtK2ZP2ntxaGNGxbP8PYXmeZGg5zkj/exec' },
            { key: 'notif',   icon: 'fa-bell', badge: true,
              url: 'https://script.google.com/macros/s/AKfycbxTCSk6HSv2JlTsLXS11hfwlwYUG5Z_ggOnYcV-o2-BG2ydOSeJIYT5swEv_sfeJVJI/exec' },
            { key: 'contact', icon: 'fa-comments',
              url: 'https://script.google.com/macros/s/AKfycbw8fgDgi_6VMunUb8jmtB8HykRFv6QbuEVY8J8HarjlR6rti3pmEUxX1hGGvTQydFXi/exec' },
            { key: 'guide',   icon: 'fa-lightbulb',
              url: 'https://script.google.com/macros/s/AKfycbwaWIjLwvVf-GpRyZ7UXSs4Rd5gqms-VRJTEhXakCcvWck3_c_zOfRE8D56AE1ztShm/exec' }
        ],
        admin: [
            { key: 'db',      icon: 'fa-users-cog',
              url: 'https://script.google.com/macros/s/AKfycbzz0oJ3_sda3gYFUP_aR5i5GnbGWLedGYcVcWBrDZKBSIHUy-PNqdtJjpngxwjEBMj0cg/exec?page=admin' },
            { key: 'payroll', icon: 'fa-file-invoice-dollar',
              url: 'https://script.google.com/macros/s/AKfycbzSvQVlzQrvd0JV3VBFhB4krkZyWplNn3KHrIOfaMzLlMYgLTk5mfEVmHYG-Xg4Vi0u/exec?page=admin' },
            { key: 'vacation',icon: 'fa-calendar-alt',
              url: 'https://script.google.com/macros/s/AKfycbzj8XQelDyz8t3oLdDO4n9tdw7FSF9_RT0OolPXMGX83wPnw1b6PEYxTXydMsFlxToV6w/exec?page=admin' },
            { key: 'archive', icon: 'fa-archive',
              url: 'https://script.google.com/macros/s/AKfycbyxdopBn-GEnTJPdFKbgyrZGTHPDxNM2dao7emfUbQqF5YoMDh70y6hEKBbIcw-iytz/exec' },
            { key: 'renewal', icon: 'fa-sync-alt',
              url: 'https://script.google.com/macros/s/AKfycbwCXvhns4jdblvOZs2SuhXQ8tIEKvdRGpFHB7rnx_afvjHoOPMWebLTYY6Eyuqj1Vrn/exec' },
            { key: 'notif',   icon: 'fa-bell', badge: true,
              url: 'https://script.google.com/macros/s/AKfycbxTCSk6HSv2JlTsLXS11hfwlwYUG5Z_ggOnYcV-o2-BG2ydOSeJIYT5swEv_sfeJVJI/exec?p=admin' },
            { key: 'guide',   icon: 'fa-lightbulb',
              url: 'https://script.google.com/macros/s/AKfycbwaWIjLwvVf-GpRyZ7UXSs4Rd5gqms-VRJTEhXakCcvWck3_c_zOfRE8D56AE1ztShm/exec?page=admin' },
            { key: 'reports', icon: 'fa-chart-line',
              url: 'https://script.google.com/macros/s/AKfycbwcRfvQ8y4nYwj4oMkT9ICtmrBqpoSoTAEdBiMqpCRtUdc_w7jumlQPxS16Hmxk-cUC/exec' }
        ]
    };

    // ===== Translations =====
    const trans = {
        ar: {
            selEyebrow: 'نظام الموارد البشرية', selTitle: 'أهلاً بك', selSubtitle: 'اختر البوابة المناسبة لك للمتابعة',
            empTitle: 'بوابة الموظف', empDesc: 'البصمة، الشفتات، بياناتك ومرتبك في مكان واحد',
            adminTitle: 'بوابة الإدارة', adminDesc: 'إدارة شؤون الموظفين والأرشيف والتقارير',
            enter: 'دخول', switchPortal: 'تبديل البوابة', back: 'رجوع', loading: 'جاري التحميل...',
            sideEmployee: 'بوابة الموظف', sideAdmin: 'بوابة الإدارة',
            rateUsBtn: 'قيّم الابلكيشن', rateUsTitle: 'قيّم تجربتك',
            items: {
                finger: 'البصمة الذكية', shift: 'سجّل شفتك اليومي', db: 'بيانات الموظفين',
                payroll: 'مفردات المرتب', vacation: 'الإجازات والأذونات', archive: 'أرشيف ملفات الموظفين',
                renewal: 'نظام التجديدات', hrLetter: 'خطابات الموارد البشرية', notif: 'الإشعارات الحديثة',
                contact: 'تواصل معنا ( اقتراح / شكوى )', guide: 'معلومات تهمك', reports: 'التقارير'
            }
        },
        en: {
            selEyebrow: 'HR System', selTitle: 'Welcome', selSubtitle: 'Choose the portal that fits you to continue',
            empTitle: 'Employee Portal', empDesc: 'Fingerprint, shifts, your data and payroll in one place',
            adminTitle: 'Admin Portal', adminDesc: 'Manage employee affairs, archive and reports',
            enter: 'Enter', switchPortal: 'Switch Portal', back: 'Back', loading: 'Loading...',
            sideEmployee: 'Employee Portal', sideAdmin: 'Admin Portal',
            rateUsBtn: 'Rate Us', rateUsTitle: 'Rate Your Experience',
            items: {
                finger: 'Smart Fingerprint', shift: 'Set Your Shift', db: 'Employee Data',
                payroll: 'Payroll', vacation: 'Vacations', archive: 'HR Archive',
                renewal: 'HR Renewal System', hrLetter: 'HR Letter', notif: 'Recent Notifications',
                contact: 'Contact Us', guide: 'Information For You', reports: 'Reports'
            }
        }
    };

    // ===== Notifications =====
    function updateNotifCount() {
        if (!currentPortal) return;
        const notifItem = LINKS[currentPortal].find(i => i.badge);
        if (!notifItem) return;
        const sep = notifItem.url.includes('?') ? '&' : '?';
        fetch(notifItem.url + sep + 'action=count')
            .then(res => res.json())
            .then(data => {
                const badge = document.getElementById('notifBadge');
                if (!badge) return;
                const count = parseInt(data.count) || 0;
                if (count > 0) { badge.innerText = count; badge.style.display = 'flex'; }
                else { badge.style.display = 'none'; }
            })
            .catch(() => {
                const badge = document.getElementById('notifBadge');
                if (badge) badge.style.display = 'none';
            });
    }

    modalEl.addEventListener('hidden.bs.modal', function () {
        iframe.src = "about:blank";
        iframe.style.visibility = 'hidden';
    });

    function requestLocAndOpen(url, title) {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                () => { openInApp(url, title); },
                () => { openInApp(url, title); },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        } else {
            openInApp(url, title);
        }
    }

    function openInApp(url, title) {
        document.getElementById('modalTitleDisplay').innerText = title;
        loader.style.display = 'flex';
        iframe.style.visibility = 'hidden';
        const finalUrl = url + (url.includes('?') ? '&' : '?') + 'authuser=0';
        modal.show();

        const offcanvasEl = document.getElementById('sidebarMenu');
        const openedOffcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
        if (openedOffcanvas) openedOffcanvas.hide();

        setTimeout(() => { iframe.src = finalUrl; }, 100);
    }

    iframe.onload = () => {
        if (iframe.src !== "about:blank" && iframe.src !== "") {
            loader.style.display = 'none';
            iframe.style.visibility = 'visible';
        }
    };

    // ===== Portal selection =====
    function selectPortal(portal) {
        currentPortal = portal;
        document.getElementById('selectionScreen').style.display = 'none';
        document.getElementById('portalDashboard').style.display = 'block';
        document.getElementById('hamburgerBtn').style.display = 'inline-flex';
        renderSidebar();
        updateNotifCount();
        clearInterval(notifTimer);
        notifTimer = setInterval(updateNotifCount, 30000);
    }

    function goToSelection() {
        currentPortal = null;
        document.getElementById('portalDashboard').style.display = 'none';
        document.getElementById('selectionScreen').style.display = 'flex';
        document.getElementById('hamburgerBtn').style.display = 'none';
        clearInterval(notifTimer);
        const offcanvasEl = document.getElementById('sidebarMenu');
        const openedOffcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
        if (openedOffcanvas) openedOffcanvas.hide();
    }

    function renderSidebar() {
        if (!currentPortal) return;
        const t = trans[currentLang];
        const list = LINKS[currentPortal];
        const wrapper = document.getElementById('navLinksWrapper');
        wrapper.innerHTML = '';
        list.forEach(item => {
            const a = document.createElement('a');
            a.href = '#';
            a.className = 'nav-link-sidebar';
            a.onclick = (e) => {
                e.preventDefault();
                if (item.geoloc) requestLocAndOpen(item.url, t.items[item.key]);
                else openInApp(item.url, t.items[item.key]);
            };
            const badgeHtml = item.badge
                ? `<span class="d-flex align-items-center"><span id="notifBadge" class="notification-badge">0</span><i class="fas fa-chevron-left arrow-icon"></i></span>`
                : `<i class="fas fa-chevron-left arrow-icon"></i>`;
            a.innerHTML = `<span class="d-flex align-items-center"><i class="fas ${item.icon} nav-icon"></i><span>${t.items[item.key]}</span></span>${badgeHtml}`;
            wrapper.appendChild(a);
        });
        document.getElementById('sideDesc').innerText = currentPortal === 'employee' ? t.sideEmployee : t.sideAdmin;
        document.getElementById('dashPortalName').innerText = currentPortal === 'employee' ? t.empTitle : t.adminTitle;
    }

    // ===== Theme =====
    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('themeIcon').className = currentTheme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
    }

    // ===== Language =====
    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const html = document.getElementById('mainHtml');
        html.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        html.lang = currentLang;
        document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
        applyTranslations();
    }

    function applyTranslations() {
        const t = trans[currentLang];
        document.getElementById('selEyebrow').innerText = t.selEyebrow;
        document.getElementById('selTitle').innerText = t.selTitle;
        document.getElementById('selSubtitle').innerText = t.selSubtitle;
        document.getElementById('empPortalTitle').innerText = t.empTitle;
        document.getElementById('empPortalDesc').innerText = t.empDesc;
        document.getElementById('adminPortalTitle').innerText = t.adminTitle;
        document.getElementById('adminPortalDesc').innerText = t.adminDesc;
        document.getElementById('empEnterTxt').innerText = t.enter;
        document.getElementById('adminEnterTxt').innerText = t.enter;
        document.getElementById('switchPortalTxt').innerText = t.switchPortal;
        document.getElementById('switchPortalTxt2').innerText = t.switchPortal;
        document.getElementById('backTxt').innerText = t.back;
        document.getElementById('loadingTxt').innerText = t.loading;
        document.getElementById('rateUsTxt').innerText = t.rateUsBtn;
        document.getElementById('rateUsFab').title = t.rateUsTitle;
        renderSidebar();
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
        });
    }
</script>
</body>
</html>
